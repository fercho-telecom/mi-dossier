<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Dossier Profesional</title>
    <style>
        body { font-family: system-ui, sans-serif; line-height: 1.6; max-width: 800px; margin: 0 auto; padding: 2rem; color: #24292e; }
        h1 { border-bottom: 2px solid #24292e; padding-bottom: 0.5rem; }
        .btn { display: inline-block; padding: 0.8rem 1.5rem; background: #24292e; color: #fff; text-decoration: none; border-radius: 6px; margin: 0.5rem 0.5rem 0.5rem 0; }
        .btn:hover { background: #444; }
        footer { margin-top: 3rem; border-top: 1px solid #ddd; padding-top: 1rem; font-size: 0.9rem; color: #666; }
    </style>
</head>
<body>
    <header>
        <h1>Tu Nombre</h1>
        <p>Breve descripción o titular profesional.</p>
    </header>

    <main>
        <section>
            <h2>Sobre mí</h2>
            <p>Aquí va la información general de tu dossier: tu especialidad, intereses, logros principales, etc.</p>
        </section>

        <section>
            <h2>Mi CV</h2>
            <p>Puedes consultar o descargar mi CV en PDF:</p>
            <!-- Cambia los nombres de los PDFs por los tuyos -->
            <a href="cv-general.pdf" target="_blank" class="btn">📄 CV General (PDF)</a>
            <a href="cv-academico.pdf" target="_blank" class="btn">📄 CV Académico (PDF)</a>
        </section>
    </main>

    <footer>
        <p>© 2026 Tu Nombre — <a href="cv-general.pdf" target="_blank">CV en PDF</a></p>
    </footer>
</body>
</html>
